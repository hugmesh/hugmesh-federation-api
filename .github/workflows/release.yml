name: Release image

# Release channels (org-wide, 2026-11-04). The channel comes from the TAG;
# scripts/release-channel.sh decides every case below and is tested by
# scripts/test-release-channel.sh, which the version job runs first:
#
#   push to main                   -> :main and :sha-<12 hex>
#   push to release/X.Y            -> :sha-<12 hex> only (the same main-style run
#                                     the release script checks before it tags)
#   push of tag vX.Y.Z-beta.N      -> :X.Y.Z-beta.N, :beta and :sha-<12 hex>,
#                                     plus a GitHub prerelease (never Latest).
#                                     The commit must be on main.
#   push of tag vX.Y.Z (stable)    -> :X.Y.Z, :X.Y, :latest and :sha-<12 hex>,
#                                     plus a GitHub release marked Latest. The
#                                     commit must be on release/X.Y. A patch on an
#                                     older line (a newer stable vA.B.C is
#                                     published) moves :X.Y but not :latest, and
#                                     its GitHub release is not marked Latest.
#   workflow_dispatch on main, a release/X.Y branch or a v* tag
#                                  -> same as the push
#   anything else                  -> refused by the version job (this includes
#                                     release/<anything that is not X.Y> and any
#                                     tag other than vX.Y.Z / vX.Y.Z-beta.N)
#
# hugmesh-release-channels: beta+stable
#
# The version is the project <version> of pom.xml. A tag must equal "v" + that
# version. :X.Y.Z is never overwritten; the floating tags :beta, :X.Y and the
# latest tag move. Every tag a run pushes points at one digest, and that digest
# is signed and attested.
#
# The version job only refuses early. "Re-run failed jobs" reuses its outputs,
# however old they are, and a newer stable can publish while a run is building,
# so whether :X.Y and the latest tag move is decided again by the same script
# right before the push and right before gh release create. No later job reads
# the version job's answer, so a re-run cannot move a floating tag to an older
# line. A window of seconds remains between that check and the registry write
# (a registry has no compare-and-swap); if a concurrent run wins it, the digest
# check after signing fails that run.
#
# There is deliberately NO pull_request / pull_request_target trigger. Every job runs on the
# variable RUNS_ON_PUBLISH (a JSON array, e.g. ["self-hosted","Linux","X64"]) only for main,
# v* tags and dispatches of those refs; otherwise (release/X.Y branches included), or when
# the variable is unset, it runs on hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH is the off
# switch. This line is not a fork-PR security boundary; the runner group settings are.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Multi-stage Docker build (Maven package -> JRE runtime). The build stage resolves the
# PRIVATE net.hugmesh libraries (hugmesh-parent, hugmesh-build-config, hugmesh-commons,
# hugmesh-auth-core) from GitHub Packages through .github/maven-ci-settings.xml, selected by
# the BuildKit secret `packages_read_token` (see the Dockerfile). Those packages are published
# by the release chain; until it has run, the Preflight step fails by name.
# The repo-root settings.xml (GitLab registry) is NOT used here and is left for GitLab CI and
# the local compose lane.
env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-federation-api

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
      channel: ${{ steps.guard.outputs.channel }}
      line: ${{ steps.guard.outputs.line }}
      sha12: ${{ steps.guard.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the release channel rules
        run: bash scripts/test-release-channel.sh

      # VERSION GUARD. Reads the project's own <version> (not the parent's) from pom.xml.
      - name: Version guard
        id: guard
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; n="{http://maven.apache.org/POM/4.0.0}"; v=E.parse("pom.xml").getroot().find(n+"version"); print(v.text.strip() if v is not None and v.text else "")')
          if [ -z "${version}" ]; then
            echo "::error::pom.xml has no project <version>"
            exit 1
          fi
          case "${version}" in
            *-SNAPSHOT)
              echo "::error::pom.xml version ${version} is a SNAPSHOT; a published image needs a fixed version such as 0.3.0-beta.1"
              exit 1
              ;;
          esac
          # Early, pom-specific refusals. scripts/release-channel.sh below checks the same
          # refs again and decides the channel, the branch rules and the image tags.
          case "${GITHUB_REF}" in
            refs/heads/main)
              ;;
            refs/heads/release/*)
              ;;
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
                echo "::error::tag ${GITHUB_REF_NAME} does not match pom.xml version ${version} (expected tag v${version})"
                exit 1
              fi
              ;;
            *)
              echo "::error::refusing to publish from ${GITHUB_REF}: only refs/heads/main, release/X.Y branches and v<version> tags publish"
              exit 1
              ;;
          esac
          # Channel, branch rules and image tags: scripts/release-channel.sh. Capture first,
          # append after, so a refusal midway writes no partial outputs.
          out="$(VERSION="${version}" VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
          printf '%s\n' "${out}" >> "$GITHUB_OUTPUT"
          echo "${out}"

  image:
    needs: version
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PREFLIGHT, cross-repo package read. Fails here, by name, instead of deep inside Maven.
      # The net.hugmesh libraries live in the PRIVATE GitHub Packages registries of the chain
      # repositories. The automatic GITHUB_TOKEN cannot read another repository's package, so
      # this job needs the PACKAGES_READ_TOKEN secret (a classic PAT with read:packages,
      # decision 90a = B in hugmesh-commons/RELEASING.md). There is deliberately NO fall-back to
      # GITHUB_TOKEN: it cannot work, and an unset secret would otherwise select the dead
      # GitLab settings.xml and fail as "Non-resolvable parent POM ... /groups//".
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${UPSTREAM_PACKAGES_TOKEN}" ]; then
            echo "::error::secret PACKAGES_READ_TOKEN is not set for this repository. Set it as a REPOSITORY secret under Settings -> Secrets and variables -> Actions (the org is on the Free plan, where an org secret does not reach private repositories): a classic personal access token with the read:packages scope. The automatic GITHUB_TOKEN cannot read another repository's packages, so there is no fall-back."
            exit 1
          fi
          rc=0
          for upstream in hugmesh-build-config hugmesh-parent hugmesh-commons hugmesh-auth-core; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished': PACKAGES_READ_TOKEN cannot read that repository's Maven registry. It must be a classic PAT with read:packages, not expired, from an account that can read the repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet (run the release chain: build-config, parent, commons, auth-core), or (b) it is published and this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404. Look at the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified, do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          exit ${rc}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A published version is immutable. Only "not found" lets a release run continue; any
      # other answer (the tag exists, or the registry could not be asked) stops it, so a
      # failed lookup can never turn into an overwrite. Only the immutable :X.Y.Z (or
      # :X.Y.Z-beta.N) is checked: the floating :beta, :X.Y and the latest tag are meant to
      # move to a newer release, so they are not.
      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        run: |
          set -uo pipefail
          ref="${IMAGE_NAME}:${VERSION}"
          # The step runs as `bash -e {0}`, and `set -uo pipefail` does not turn -e off: a bare
          # `out=$(...)` would end the step on the normal "not found" answer of a first
          # publish, before the rc check below. `|| rc=$?` keeps the failure in rc.
          rc=0
          out=$(docker buildx imagetools inspect "${ref}" 2>&1) || rc=$?
          if [ "${rc}" -eq 0 ]; then
            case "${VERSION}" in
              *-*) next="raise the -beta.N in pom.xml, merge to main, and tag the new version" ;;
              *) next="fix forward with the next patch (raise X.Y.Z on release/${VERSION%.*}), merge, and tag the new version" ;;
            esac
            echo "::error::${ref} already exists in GHCR. A published version is never overwritten: ${next}."
            exit 1
          fi
          case "${out}" in
            *"not found"*|*"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"name unknown"*|*"NAME_UNKNOWN"*)
              echo "  ${ref} is not published yet; continuing."
              ;;
            *)
              printf '%s\n' "${out}"
              echo "::error::could not tell whether ${ref} exists (exit ${rc}, output above). Refusing to push rather than risk overwriting it. If ${IMAGE_NAME} has never been pushed at all, GHCR may answer 'denied' instead of 'not found': let the main build run first (merge to main, or a manual run on main) so the package exists, then re-run this tag."
              exit 1
              ;;
          esac

      # Builds now and pushes nothing, so the step that pushes finds every layer in the
      # builder's cache and takes seconds. The tag check below would otherwise be as old as
      # the whole build by the time the tags are written.
      - name: Build the image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Compute tags and labels
        id: meta
        run: |
          set -euo pipefail
          # scripts/release-channel.sh decides the tag list here, right before the push, not
          # in the version job: beta -> :X.Y.Z-beta.N + :beta; stable -> :X.Y.Z plus :X.Y and
          # the latest tag when nothing newer is published on its line / on any line; main ->
          # :main; every run adds :sha-<12>.
          out="$(VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
          echo "${out}"
          tags="$(printf '%s\n' "${out}" | sed -n '/^image_tags<<EOF_IMAGE_TAGS$/,/^EOF_IMAGE_TAGS$/p' | sed '1d;$d')"
          move_latest="$(printf '%s\n' "${out}" | sed -n 's/^move_latest=//p')"
          if [ -z "${tags}" ]; then
            echo "::error::scripts/release-channel.sh computed no image tags"
            exit 1
          fi
          while IFS= read -r t; do
            case "${t}" in
              "${IMAGE_NAME}":?*) ;;
              *) echo "::error::unexpected image tag '${t}'"; exit 1 ;;
            esac
          done <<< "${tags}"
          if [ "${KIND}" = release ]; then
            label_version="${VERSION}"
          else
            label_version="${GITHUB_REF_NAME}"
          fi
          {
            echo "move_latest=${move_latest}"
            echo "tags<<EOF_TAGS"
            echo "${tags}"
            echo "EOF_TAGS"
            echo "label_version=${label_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"
          echo "${tags}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, never an ARG/ENV, never persisted in a layer.
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_TAGS: ${{ steps.meta.outputs.tags }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split() if t)
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the computed tags {expected}")
          # latest only for a stable version that owns it (MOVE_LATEST from the check right
          # before the push). The "-" fallback makes a missing or EMPTY VERSION fail closed (a
          # job output that was never set arrives as "", not unset).
          if "latest" in tags and ("-" in (os.environ.get("VERSION") or "-") or os.environ.get("MOVE_LATEST") != "true"):
              sys.exit("::error::a tag named latest was pushed; beta images must never be tagged latest, and neither may an older-line patch")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag that resolves
      # to it. Prove each pushed tag does (a floating tag moved by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # A digest is the sha256 of the manifest's exact bytes, which --raw
            # prints. Do not use --format '{{.Manifest.Digest}}': buildx answers
            # any format that starts with {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)"; then
              echo "::error::could not read $ref from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the signed digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $DIGEST (signed)"
          done <<< "$TAGS"

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/[0-9]+[.][0-9]+|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # beta -> prerelease, never Latest. stable -> a full release, marked Latest only when
      # nothing newer is published on any line (gh would otherwise pick Latest by date and
      # mislabel an older-line patch). That is decided here, right before the release is
      # created: a newer stable may have published since the image job, or days ago if this
      # is a re-run.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; nothing to do"
            exit 0
          fi
          flags=(--verify-tag)
          case "${VERSION}" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *)
              out="$(VERSION_FILE=pom.xml bash scripts/release-channel.sh)"
              echo "${out}"
              move_latest="$(printf '%s\n' "${out}" | sed -n 's/^move_latest=//p')"
              if [ "${move_latest}" = true ]; then
                flags+=(--latest)
              else
                flags+=(--latest=false)
              fi
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            --title "hugmesh-federation-api ${VERSION}" \
            --notes "Image: ghcr.io/hugmesh/hugmesh-federation-api:${VERSION}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
