# Full-context test profile. The DB (R2DBC for the app + JDBC for Liquibase) is a
# REAL Postgres container wired by spring-boot-testcontainers @ServiceConnection in
# PostgresTestSupport — NO H2 here (the @DataR2dbcTest slices still use H2 via
# TestDatabaseConfig). Cassandra is disabled so the noop manifest cache wins; bundle
# storage is filesystem under a temp dir.
#
# spring.r2dbc.url / spring.liquibase.url are deliberately ABSENT: @ServiceConnection
# supplies both the r2dbc ConnectionFactory and the Liquibase JDBC connection details,
# pointed at the SAME container, so Liquibase migrates the DB the app then reads.
spring:
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
  security:
    oauth2:
      resourceserver:
        jwt:
          # No real issuer in tests; a fixed jwk-set URI keeps the resource-server
          # autoconfig happy without dialing out (no token is validated in the
          # context-load smoke test).
          jwk-set-uri: "http://localhost:0/jwks"

app:
  bundles:
    storage: filesystem
    dir: "${java.io.tmpdir}/hugmesh-federation-api-test-bundles"
  manifest-cache:
    cassandra:
      enabled: false
