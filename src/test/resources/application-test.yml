# Slice / context-load test profile. No external infra: R2DBC + Liquibase point
# at an embedded H2 (the @DataR2dbcTest slices use TestDatabaseConfig instead;
# this file backs the full-context smoke test). Cassandra is disabled so the
# noop manifest cache wins; bundle storage is filesystem under a temp dir.
spring:
  r2dbc:
    url: "r2dbc:h2:mem:///fed_ctx;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;USER=sa;PASSWORD="
    username: sa
    password: ""
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    url: "jdbc:h2:mem:fed_ctx;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=ACTION,TARGET,VALUE,KEY,VERSION;DATABASE_TO_LOWER=TRUE"
    user: sa
    password: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          # No real issuer in tests; a fixed jwk-set URI keeps the resource-server
          # autoconfig happy without dialing out (no token is validated in the
          # context-load smoke test).
          jwk-set-uri: "http://localhost:0/jwks"

app:
  bundles:
    storage: filesystem
    dir: "${java.io.tmpdir}/snapdragon-federation-test-bundles"
  manifest-cache:
    cassandra:
      enabled: false
