spring:
  application:
    name: snapdragon-federation-api

  # The spring-boot-starter-data-cassandra-reactive starter is on the classpath
  # ONLY for the best-effort manifest write-through cache (CassandraManifestCache),
  # which builds its own CqlSession lazily + gated. We do NOT want Spring Boot to
  # auto-manage a CqlSession (it would eagerly dial Cassandra at startup and the
  # actuator Cassandra health contributor would fail a no-Cassandra boot). Exclude
  # the auto-config so startup never depends on a reachable Cassandra — matching
  # admin-bff's "driver only, no spring-data autoconfig" design.
  # Spring Boot 4 split auto-configuration into per-module packages: the Cassandra
  # auto-config classes moved out of o.s.b.autoconfigure.* / o.s.b.actuate.autoconfigure.*
  # into o.s.b.cassandra.autoconfigure.* / o.s.b.data.cassandra.autoconfigure.*. The old
  # FQCNs are silently ignored (a non-matching exclusion is a no-op), so they MUST be
  # updated or Cassandra auto-config re-activates and eagerly dials at startup.
  autoconfigure:
    exclude:
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.health.CassandraHealthContributorAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.health.CassandraReactiveHealthContributorAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Casdoor issuer. The JWK set is discovered from the issuer's
          # well-known config; override the issuer per environment.
          issuer-uri: "${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}"
          # Explicit JWKS so the resource server does NOT do OIDC discovery against issuer-uri
          # (unreachable in-container when issuer-uri is the browser-facing localhost:8000, which
          # 500s every authenticated call). Mirrors snapdragon-actions + the gateway; compose sets
          # CASDOOR_JWKS_URI=http://casdoor:8000/.well-known/jwks. iss is still validated via issuer-uri.
          jwk-set-uri: "${CASDOOR_JWKS_URI:${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}/.well-known/jwks}"

  # Runtime data access is REACTIVE (R2DBC). Owns federation_modules,
  # user_modules, moderation_requests, federation_override.
  r2dbc:
    url: "${SPRING_R2DBC_URL:r2dbc:postgresql://snapdragon-pg.snapdragon-backend.svc.cluster.local:5432/federation}"
    username: "${SPRING_R2DBC_USERNAME:snapdragon}"
    password: "${SPRING_R2DBC_PASSWORD:}"

  # Liquibase owns schema migrations. It has NO R2DBC runner, so it uses a plain
  # JDBC datasource — the ONLY JDBC use in the app; all runtime access is R2DBC.
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    url: "${SPRING_LIQUIBASE_URL:jdbc:postgresql://snapdragon-pg.snapdragon-backend.svc.cluster.local:5432/federation}"
    user: "${SPRING_LIQUIBASE_USER:snapdragon}"
    password: "${SPRING_LIQUIBASE_PASSWORD:}"

app:
  # Bundle storage for user_modules. 'filesystem' (default) keeps a vanilla
  # `docker compose up -d` working with no object store; 's3' swaps in the
  # fully-implemented S3/MinIO strategy (S3BundleStorage — AWS S3 in prod, MinIO in dev/CI; see README Bundle storage).
  bundles:
    storage: "${APP_BUNDLES_STORAGE:filesystem}"
    dir: "${APP_BUNDLES_DIR:/var/snapdragon/federation/bundles}"
    # Max bytes accepted for a single bundle PUT body before a 413 is returned. The
    # body streams straight to disk (DataBufferUtils.write), which bypasses
    # spring.codec.max-in-memory-size, so this is the ONLY ceiling on the upload —
    # it bounds disk usage so an authenticated caller cannot exhaust the bundles
    # volume with a multi-GB / infinite chunked octet-stream. Default 256 MiB.
    max-bytes: "${APP_BUNDLES_MAX_BYTES:268435456}"
    s3:
      endpoint: "${APP_BUNDLES_S3_ENDPOINT:}"
      region: "${APP_BUNDLES_S3_REGION:us-east-1}"
      access-key: "${APP_BUNDLES_S3_ACCESS_KEY:}"
      secret-key: "${APP_BUNDLES_S3_SECRET_KEY:}"
      bucket: "${APP_BUNDLES_S3_BUCKET:snapdragon-federation}"

  # Best-effort write-through cache of the rendered manifest into a Cassandra
  # table the remote-fragment pods / edge can poll. Disabled-friendly: any
  # failure (unconfigured / unreachable) logs + no-ops; the authoritative read
  # always falls back to Postgres. Mirrors admin-bff's CassandraRouteMirror.
  manifest-cache:
    cassandra:
      enabled: "${MANIFEST_CACHE_ENABLED:false}"
      contact-point: "${MANIFEST_CACHE_CASSANDRA:cassandra.snapdragon-pki.svc.cluster.local:9042}"
      keyspace: "${MANIFEST_CACHE_KEYSPACE:snapdragon_federation}"
      local-dc: "${MANIFEST_CACHE_LOCAL_DC:dc1}"
      # ── Ships-dark CQL auth (HELD: default OFF until the Cassandra cluster is
      # secured). When auth.enabled=true the CqlSession dials with
      # .withAuthCredentials(username, password). The password is sourced ONLY from
      # MANIFEST_CACHE_CASSANDRA_PASSWORD wired to a K8s/ESO Secret (secretKeyRef in
      # deploy/deployment.yaml) — empty-defaulted here so it is NEVER committed.
      # Leaving auth.enabled false (the default) means the credentials are never
      # read and the session builds exactly as before.
      auth:
        enabled: "${MANIFEST_CACHE_CASSANDRA_AUTH_ENABLED:false}"
        username: "${MANIFEST_CACHE_CASSANDRA_USERNAME:}"
        password: "${MANIFEST_CACHE_CASSANDRA_PASSWORD:}"
      # ── Ships-dark CQL TLS (HELD: default OFF until the Cassandra cluster is
      # secured + presents a server cert chaining to the truststore). When
      # ssl.enabled=true the CqlSession dials with .withSslContext(...) built from a
      # PKCS12 truststore (and optional keystore for client mTLS). The store paths
      # point at the in-pod /stores tmpfs assembled by the build-keystore
      # initContainer; the store PASSWORDS are read from the in-pod
      # application-cassandra-tls.properties (loaded via SPRING_CONFIG_ADDITIONAL_LOCATION)
      # so they NEVER touch git, a Secret, or the pod spec. Empty-defaulted here.
      ssl:
        enabled: "${MANIFEST_CACHE_CASSANDRA_SSL_ENABLED:false}"
        truststore: "${MANIFEST_CACHE_CASSANDRA_SSL_TRUSTSTORE:/stores/cassandra-truststore.p12}"
        truststore-password: "${MANIFEST_CACHE_CASSANDRA_SSL_TRUSTSTORE_PASSWORD:}"
        keystore: "${MANIFEST_CACHE_CASSANDRA_SSL_KEYSTORE:}"
        keystore-password: "${MANIFEST_CACHE_CASSANDRA_SSL_KEYSTORE_PASSWORD:}"

# SpringDoc OpenAPI. Spec at /v3/api-docs is the source the platform
# ng-openapi-gen typed clients + docs pipeline consume. Spec + UI are gated by
# SecurityConfig: permitAll under dev/test (so gen:fetch can curl the spec
# without a token) and ROLE_ADMIN otherwise (prod). Mirrors admin-bff.
springdoc:
  # Force JSON as the default produced media type. Without this, springdoc emits
  # `*/*` for endpoints with no explicit `produces`, which ng-openapi-gen maps to a
  # `Blob` response type — breaking JSON parsing in the generated typed clients.
  # Mirrors snapdragon-admin-bff-api / snapdragon-mod-bff-api.
  default-produces-media-type: application/json
  api-docs:
    enabled: true
    path: /v3/api-docs
    # Emit OpenAPI 3.0.1 (not springdoc-3.x's new 3.1.0 default). The Boot-4 upgrade
    # put this service on springdoc 3.x (via snapdragon-parent), which silently
    # switched the dumped spec to 3.1.0 — but the Angular UIs generate their typed
    # clients with ng-openapi-gen 0.51.0, which CANNOT parse 3.1.0. Pinning back to
    # 3.0 keeps the BFF<->UI ng-openapi-gen contract unchanged. Mirrors admin-bff.
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: systems.snapdragon.federation

# Resilience4j circuit breaker for the access-suspension profile-ban write path.
# OverrideService.applyUserScope / clearScopeBySource wrap their DIRECT-repo
# federation_override write in @CircuitBreaker(name = "federationOverride") so a
# wedged override store fails FAST instead of stalling the ban caller (mod-bff /
# admin-bff). Correctness does not depend on the write succeeding inline: the
# durable row IS the source of truth, so the vanity read path + manifest converge
# once it lands. Tuning mirrors the admin-bff / actions casdoor breaker
# (window 10, minCalls 5, 50% threshold, 30s open, 3 half-open probes).
resilience4j:
  circuitbreaker:
    instances:
      federationOverride:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (the gateway-chart
  # build-keystore equivalent: PKCS12 keystore.p12 = this service's Vault-PKI
  # identity + truststore.p12 = the cluster CA), the deployment flips these on so
  # the TLS handshake REQUIRES a client cert that chains to the cluster CA. A
  # caller that was NOT deployed+signed by our Vault/ESO PKI process holds no such
  # cert, so its handshake is rejected — it cannot read or call this API at all.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted
  # PKCS12 stores (default paths below match the gateway chart's /stores layout).
  # The store passwords are generated in-pod and injected via env (never in git).
  ssl:
    enabled: "${SSL_ENABLED:false}"
    client-auth: "${SSL_CLIENT_AUTH:none}"
    key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
    key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
    key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
    trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
    trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
    trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: "${SSL_ENABLED_PROTOCOLS:TLSv1.3}"
