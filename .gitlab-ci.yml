# Snapdragon CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the rest of the org).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.
stages: [security, dast, build]

build:image:
  stage: build
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

dependency-check:
  stage: security
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - |
      docker run --rm \
        -v "$(pwd):/workspace" \
        -v "$(pwd)/.dep-check-data:/dep-check-data" \
        -w /workspace \
        --entrypoint "" \
        eclipse-temurin:21-jdk-noble \
        ./mvnw org.owasp:dependency-check-maven:check \
          -Dformat=HTML,JSON \
          -DfailBuildOnCVSS=9 \
          -DdataDirectory=/dep-check-data \
          -DautoUpdate=true \
          -B
  cache:
    key: dep-check-nvd
    paths: [.dep-check-data/]
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
      - target/dependency-check-report.json
    expire_in: 30 days

zap-api-scan:
  stage: dast
  needs: [test]
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  # Set DAST_TARGET_URL in GitLab CI/CD > Variables to activate the live scan.
  # Example: DAST_TARGET_URL=http://gateway.test-env:8080 pointing at a running
  # test environment. When unset the job exits 0 (advisory only, no gate).
  script:
    - |
      if [ -z "${DAST_TARGET_URL:-}" ]; then
        echo "[zap-api-scan] DAST_TARGET_URL not configured — no live target available."
        echo "Set DAST_TARGET_URL in GitLab CI/CD Variables to point to a running test env."
        echo "Example: DAST_TARGET_URL=http://gateway.test-env:8080"
        exit 0
      fi
      docker run --rm \
        -v "$(pwd):/zap/wrk:rw" \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py \
          -t "${DAST_TARGET_URL}/v3/api-docs" \
          -f openapi \
          -r zap-report.html \
          -w zap-report.md \
          -x zap-report.xml \
          -l WARN \
          -I
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.xml
      - zap-report.md
    expire_in: 30 days
