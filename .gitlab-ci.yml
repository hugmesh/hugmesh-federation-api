# Snapdragon CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the rest of the org).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# The OWASP pen-test stage is pulled in from the canonical, org-wide template in
# snapdragon-generator (the single source of truth: Dependency-Check SCA + the
# authenticated ZAP DAST harness with the custom escalation/DoS probes + nuclei).
# See memory snapdragon-pentest-standard / snapdragon-nuclei-integration.
include:
  - project: 'Snapdragon-Systems/snapdragon-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

# `pentest` stage added; the original `security` / `dast` stages are kept so any
# pipeline references to them (and the migrated jobs) remain valid.
stages: [security, dast, pentest, build]

build:image:
  stage: build
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# Pen-test stage (canonical, org-wide). These thin jobs `extends:` the hidden
# `.pentest-*` jobs from the generator template so there is ONE source of truth
# and the FULL harness (Dependency-Check SCA + ZAP DAST with the custom
# escalation/DoS probes + nuclei) runs. allow_failure keeps the stage advisory —
# it never gates the build. Rules mirror this repo's prior security-job posture:
# default branch + merge requests.
#
# These REPLACE the previously-inline `dependency-check` (SCA) and `zap-api-scan`
# (DAST) P2-1 jobs, which are migrated here so there is no duplicate scan path.
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
